[package]
name = "nvim-rpc-ui"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-independent Neovim UI state, frames, and input"
documentation = "https://docs.rs/nvim-rpc-ui"
readme = "README.md"
keywords = ["neovim", "nvim", "ui", "rpc"]
categories = ["api-bindings", "gui"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
nvim-rpc.workspace = true
nvim-rpc-plugin.workspace = true
rmp-serde = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
tokio = { workspace = true, features = ["sync", "time", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time", "process"] }
